name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taskuser:taskpass@localhost:5432/tasks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Provera ranjivosti zavisnosti (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit testovi i pokrivenost koda
        run: npm test

      - name: Integracioni testovi (PostgreSQL)
        run: npm run test:integration

      - name: Sacuvaj izvestaj o pokrivenosti
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pokreni aplikaciju i bazu (docker compose)
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done
          curl --fail -X POST http://localhost:3000/tasks \
            -H "Content-Type: application/json" -d '{"title":"smoke test"}'
          curl --fail http://localhost:3000/tasks
          curl --fail http://localhost:3000/stats
          curl --fail http://localhost:3000/ | grep -qi "<title>"

      - name: Logovi (samo pri gresci)
        if: failure()
        run: docker compose logs

      - name: Ugasi okruzenje
        if: always()
        run: docker compose down -v

  publish:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Ime image-a malim slovima
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prijava na GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metapodaci (tagovi)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build i push image-a
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
