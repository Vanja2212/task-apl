name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testovi i pokrivenost koda
        run: npm test

      - name: Sacuvaj izvestaj o pokrivenosti
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t task-api:${{ github.sha }} .
      - name: Smoke test kontejnera
        run: |
          docker run -d --name api -p 3000:3000 task-api:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:3000/health
